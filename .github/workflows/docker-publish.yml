name: Docker Publish

# Builds and publishes the production image to GitHub Container Registry.
#
# The image runs the standalone Next.js build (see Dockerfile) with a non-root
# user, a healthcheck, and no secrets baked in. Publishing to GHCR means a host
# (VPS, Render, Fly.io, etc.) can deploy by pulling the tagged image, without
# a source checkout or a local build.
#
# C-008: publishes for push to main are GATED on the CI workflow succeeding.
# This workflow used to trigger directly on push and build independently, so a
# commit whose audit/tests/RLS checks failed could still ship an image as long
# as the Docker build itself passed. Now:
#
#   - push to main -> runs only AFTER "CI" completes on that exact commit,
#     and only if its conclusion is success (workflow_run gate below).
#   - a tag like v1.2.3 -> publishes directly. Tags are deliberate human
#     release actions cut from a commit that already passed CI on main.
#   - workflow_dispatch -> manual publish, for tested hotfix scenarios.
#
# Requires the GITHUB_TOKEN (built in) to have read/write packages permission —
# enabled by default for the repository's Actions. No extra secrets needed.
#
# The image is multi-arch (linux/amd64 + linux/arm64) so the same tag runs on
# a generic VPS and on OCI's ARM Ampere instances (deploy/oci/). Public
# NEXT_PUBLIC_* browser config is baked in from repo Variables — set them
# under Settings → Secrets and variables → Actions → Variables (see the
# build-args list below and docs/OCI-HOSTING.md §2).

on:
  # NOTE: `branches` filters the *source* workflow's ref, not this one.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # The GHCR image name is computed in a job step below: github.repository
  # preserves the owner/repo case (Teamthy/Famex-OS), but GHCR repository
  # names must be lowercase or buildx rejects the tag before building.

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Compute lowercase GHCR image name
        id: image
        run: echo "name=$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: "Gate: publish only when CI passed on this commit"
        if: github.event_name == 'workflow_run'
        run: |
          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" ]]; then
            echo "::error::CI concluded with '${{ github.event.workflow_run.conclusion }}' — refusing to publish the image."
            exit 1
          fi

      - name: Checkout (the exact commit CI validated)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tag
        id: meta
        run: |
          # Tag style: "1.2.3" for v1.2.3; "main" for CI-gated main publishes.
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#v}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            TAG="main"
          else
            TAG="${GITHUB_REF_NAME//[^a-zA-Z0-9._-]/-}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${{ steps.image.outputs.name }}:$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Multi-arch: amd64 for generic VPS/Render, arm64 for OCI Ampere A1
          # (the Always Free shape — an amd64-only image dies there with
          # "exec format error"). The arm64 build runs under QEMU, so first
          # builds are slow; the gha cache keeps later ones bearable.
          # Per-platform correctness matters here: Prisma engines and sharp
          # are platform binaries fetched during `npm ci`, so each platform
          # must build its own layers rather than sharing one build's output.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
          # NEXT_PUBLIC_* values are inlined at build time (see Dockerfile).
          # They are public, so they come from repo *Variables* (Settings →
          # Secrets and variables → Actions → Variables), never Secrets.
          # Unset variables build an unbranded browser bundle; the server
          # still reads the runtime environment for everything server-side.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_APK_URL=${{ vars.NEXT_PUBLIC_APK_URL }}
            NEXT_PUBLIC_APK_FALLBACK_URL=${{ vars.NEXT_PUBLIC_APK_FALLBACK_URL }}
            NEXT_PUBLIC_APK_SIZE=${{ vars.NEXT_PUBLIC_APK_SIZE }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
            NEXT_PUBLIC_SHOW_DEMO_BADGE=${{ vars.NEXT_PUBLIC_SHOW_DEMO_BADGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "Published ${{ env.REGISTRY }}/${{ steps.meta.outputs.IMAGE }}"
          echo "Pull: docker pull ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ steps.meta.outputs.tag }}"
