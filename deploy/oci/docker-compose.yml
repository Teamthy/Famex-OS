# ─────────────────────────────────────────────────────────────────────────────
# Famex OS on OCI Always Free (Ampere A1, ARM64) — single-VM production stack.
#
# This file is SELF-CONTAINED: copy deploy/oci/ to the VM as /opt/famex, fill
# in .env, run ./deploy.sh. No source checkout and no on-VM build — the app
# image is pulled from GHCR (multi-arch; see .github/workflows/docker-publish.yml).
# Full guide: docs/OCI-HOSTING.md.
#
# Topology (pick ONE ingress via COMPOSE_PROFILES in .env):
#   public  → Caddy on 80/443 with automatic HTTPS (needs the OCI security
#             list + host iptables opened — bootstrap.sh does the host part)
#   tunnel  → Cloudflare Tunnel, zero inbound ports (needs TUNNEL_TOKEN)
#
# Optional extra profile: monitoring (Uptime Kuma on 127.0.0.1:3001 only).
#
# Differences from docker-compose.prod.yml, on purpose:
#   - app pulls the GHCR image instead of `build: .` (a Next.js build on a
#     2-OCPU free VM is slow and memory-hungry; CI already built it)
#   - app's port 3000 is NOT published — only the ingress can reach it
#   - no redis container: the app does not speak redis:// yet (C-005), and
#     single-instance rate limiting runs in memory (ALLOW_MEMORY_RATE_LIMITS)
#   - backup uses postgres:16-alpine itself (guaranteed multi-arch) instead
#     of a third-party backup image; offsite copies go to OCI Object Storage
#     or R2 via backup-offsite.sh on a systemd timer
#   - memory limits + log rotation sized for a 6–12 GB free-tier VM
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Ingress option A: Caddy (public 80/443, automatic HTTPS) ──────────────
  caddy:
    image: caddy:2-alpine
    profiles: ["public"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env (e.g. portal.example.com)}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env (for TLS expiry notices)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    logging: *default-logging

  # ── Ingress option B: Cloudflare Tunnel (no inbound ports at all) ─────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env (Cloudflare Zero Trust → Tunnels)}
    command: tunnel --no-autoupdate run
    mem_limit: 256m
    logging: *default-logging

  # ── App ────────────────────────────────────────────────────────────────────
  app:
    image: ${APP_IMAGE:-ghcr.io/teamthy/famex-os}:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000" # internal only — reached via caddy/cloudflared as app:3000
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-famex}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-famex_os}}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (32+ chars)}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL (https://…)}
      # Boot behaviour (docker-entrypoint.sh): migrations always; CBT bank if true.
      SEED_CBT_ON_BOOT: ${SEED_CBT_ON_BOOT:-false}
      JOBS_SECRET: ${JOBS_SECRET:?set JOBS_SECRET}
      # Payments / email / SMS
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:?set PAYSTACK_PUBLIC_KEY}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:?set PAYSTACK_SECRET_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TERMII_API_KEY: ${TERMII_API_KEY:-}
      TERMII_SENDER_ID: ${TERMII_SENDER_ID:-}
      # Single-instance rate limiting (see header). Set Upstash vars instead
      # if this deployment ever grows past one app container.
      ALLOW_MEMORY_RATE_LIMITS: ${ALLOW_MEMORY_RATE_LIMITS:-true}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      # Admission documents — S3-compatible (use Cloudflare R2 here: browser
      # direct uploads need bucket CORS, which OCI Object Storage lacks.
      # OCI Object Storage is used for server-side backups instead.)
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ADMISSIONS_PREFIX: ${S3_ADMISSIONS_PREFIX:-admissions}
      MALWARE_SCANNER_URL: ${MALWARE_SCANNER_URL:-}
      # School profile / first-admin seed (prisma/seed.ts reads these when you
      # run `docker compose exec app node prisma/seed-admin.mjs` once).
      SCHOOL_SLUG: ${SCHOOL_SLUG:-famex-international-schools}
      SCHOOL_NAME: ${SCHOOL_NAME:-}
      SCHOOL_ADDRESS: ${SCHOOL_ADDRESS:-}
      SCHOOL_PHONE: ${SCHOOL_PHONE:-}
      SCHOOL_EMAIL: ${SCHOOL_EMAIL:-}
      SCHOOL_MOTTO: ${SCHOOL_MOTTO:-}
      SCHOOL_CUSTOM_DOMAIN: ${SCHOOL_CUSTOM_DOMAIN:-}
      SCHOOL_TIMEZONE: ${SCHOOL_TIMEZONE:-Africa/Lagos}
      STAFF_LATE_CUTOFF: ${STAFF_LATE_CUTOFF:-08:00}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-}
      # Error tracking (server side; the browser DSN is baked at build time).
      SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test:
        ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 2048m
    logging: *default-logging

  # ── Database ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-famex_os}
      POSTGRES_USER: ${POSTGRES_USER:-famex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # Conservative tuning for a small shared VM (6–12 GB total). Raise
    # shared_buffers/effective_cache_size if this VM ends up DB-dedicated.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=4GB
      - -c
      - max_connections=100
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-famex} -d ${POSTGRES_DB:-famex_os}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 2048m
    logging: *default-logging

  # ── Notification dispatcher (60s tick → /api/jobs/dispatch-notifications) ──
  cron:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      JOBS_SECRET: ${JOBS_SECRET:?set JOBS_SECRET}
    command: >
      sh -c 'while true; do
        curl -fsS -X POST http://app:3000/api/jobs/dispatch-notifications -H "x-jobs-secret: $$JOBS_SECRET" || true;
        sleep 60;
      done'
    mem_limit: 64m
    logging: *default-logging

  # ── Local daily backups (offsite copy: backup-offsite.sh timer) ───────────
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-famex_os}
      PGUSER: ${POSTGRES_USER:-famex}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    command: >
      sh -c 'while true; do
        ts=$$(date +%Y%m%d-%H%M%S);
        echo "[backup] dumping $$PGDATABASE → famex-$$ts.sql.gz";
        pg_dump --no-owner --no-privileges | gzip > /backups/famex-$$ts.sql.gz.tmp
          && mv /backups/famex-$$ts.sql.gz.tmp /backups/famex-$$ts.sql.gz
          || echo "[backup] FAILED at $$ts";
        find /backups -name "famex-*.sql.gz" -mtime +$$BACKUP_KEEP_DAYS -delete;
        sleep 86400;
      done'
    mem_limit: 256m
    logging: *default-logging

  # ── Optional: uptime dashboard (localhost only — reach via SSH tunnel) ────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    mem_limit: 512m
    logging: *default-logging

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  uptime_kuma_data:
